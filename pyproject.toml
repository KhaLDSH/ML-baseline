[project]
name = "ML-baseline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "typer==0.20.1",
    "streamlit==1.52.2",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "requests==2.32.5",
    "numpy>=2.4.0",
    "scikit-learn>=1.8.0",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_baseline"]
